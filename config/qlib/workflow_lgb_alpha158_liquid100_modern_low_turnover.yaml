# LightGBM + Alpha158，现代 liquid100 低换手候选
# provider: ~/.qlib/qlib_data/us_modern_liquid100
# benchmark: SPY

qlib_init:
    provider_uri: "~/.qlib/qlib_data/us_modern_liquid100"
    region: us

experiment_name: lightgbm_alpha158_liquid100_modern_low_turnover_candidate_deterministic

market: &market liquid100
benchmark: &benchmark SPY

data_handler_config: &data_handler_config
    start_time: "2020-11-02"
    end_time: "2026-05-15"
    fit_start_time: "2020-11-02"
    fit_end_time: "2023-12-29"
    instruments: *market

port_analysis_config: &port_analysis_config
    strategy:
        class: DeterministicTopkDropoutStrategy
        module_path: us_quant.qlib_strategies
        kwargs:
            signal: <PRED>
            topk: 15
            n_drop: 1
            hold_thresh: 3
    backtest:
        start_time: "2025-01-02"
        end_time: "2026-05-15"
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: null
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.03
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 6
            num_leaves: 64
            num_threads: 0
            seed: 20260525
            feature_fraction_seed: 20260525
            bagging_seed: 20260525
            data_random_seed: 20260525
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: ["2020-11-02", "2023-12-29"]
                valid: ["2024-01-02", "2024-12-31"]
                test: ["2025-01-02", "2026-05-15"]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
