# LightGBM + Alpha158，现代小股票池验证版
# provider: ~/.qlib/qlib_data/us_modern_mega20
# 注意：当前本地 CSV 缺少 SPY/QQQ，本配置临时用 AAPL 作为 benchmark，
# 只用于验证现代 provider -> Qlib workflow 链路，不用于严肃业绩归因。

qlib_init:
    provider_uri: "~/.qlib/qlib_data/us_modern_mega20"
    region: us

experiment_name: lightgbm_alpha158_mega20_modern

market: &market mega20
benchmark: &benchmark AAPL

data_handler_config: &data_handler_config
    start_time: 2020-11-02
    end_time: 2025-03-20
    fit_start_time: 2020-11-02
    fit_end_time: 2022-12-30
    instruments: *market

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 5
            n_drop: 1
    backtest:
        start_time: 2024-01-02
        end_time: 2025-03-20
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: null
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.05
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 6
            num_leaves: 64
            num_threads: 0
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2020-11-02, 2022-12-30]
                valid: [2023-01-03, 2023-12-29]
                test: [2024-01-02, 2025-03-20]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
