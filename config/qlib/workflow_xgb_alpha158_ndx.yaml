# XGBoost + Alpha158，纳斯达克100
# 对比 LightGBM 的效果

qlib_init:
    provider_uri: "~/.qlib/qlib_data/us_data"
    region: us

experiment_name: xgboost_alpha158_ndx

market: &market nasdaq100
benchmark: &benchmark SPY

data_handler_config: &data_handler_config
    start_time: 2010-01-01
    end_time: 2020-10-30
    fit_start_time: 2010-01-01
    fit_end_time: 2015-12-31
    instruments: *market

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 10
            n_drop: 1
    backtest:
        start_time: 2018-01-01
        end_time: 2020-10-30
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: null
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: XGBModel  # 使用 XGBoost
        module_path: qlib.contrib.model.xgboost
        kwargs:
            eval_metric: rmse
            colsample_bytree: 0.8879
            eta: 0.05
            subsample: 0.8789
            alpha: 205.6999
            lambda: 580.9768
            max_depth: 8
            num_leaves: 210
            nthread: 0
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2010-01-01, 2015-12-31]
                valid: [2016-01-01, 2017-12-31]
                test: [2018-01-01, 2020-10-30]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
